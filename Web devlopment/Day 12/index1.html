<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Outlines</title>
</head>
<style>
    .box{
        border: 3px solid black;
        box-shadow: 5px 15px 5px gray ;
        width: 50vw;
        height: 25vh;
        text-shadow: 2px 1px 1px rgb(239, 84, 84);
    }
    .Para{
        text-shadow: 1px 1px 5px rgb(209, 0, 0);
        outline: 3px solid rgb(35, 251, 1);
        border: 5px solid rgb(162, 52, 52);
        outline-offset: 5px;
        border-radius: 25px;
        padding: 25px;
        
    }
</style>
<body>
    <div class="box">
        I am a Box
    </div>
    <p class="Para">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Maxime impedit architecto aliquid nihil exercitationem alias, cum perspiciatis placeat dolores non quas consequuntur dolorem tempora excepturi soluta est officia expedita asperiores.
    </p>
</body>
</html>
