<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events bubbling</title>
    <style>
        .child{
            border: 2px solid black;
            width: 70vw;
            height: 15vh;
            background-color: antiquewhite;
            text-align: center;
            cursor: pointer;
            padding: 14px;
            margin: 14px;
        }
        .childcontainer{
              padding: 14px;
            margin: 14px;
            background-color: rgb(194, 118, 18);
                    cursor: pointer;
        }
        .container{
              padding: 14px;
            margin: 14px;
            background-color: aqua;
                    cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="childcontainer">
            <div class="child">I am box</div>
    </section>
    <script>
        document.querySelector(".child").addEventListener("click",(e)=>{
            // e.stopPropagation
            alert("child was clicked")
        })
        document.querySelector(".childcontainer").addEventListener("click",(e)=>{
            //  e.stopPropagation
            alert("childcontainer was clicked")
        })
        document.querySelector(".container").addEventListener("click",(e)=>{
            //  e.stopPropagation
            alert("container was clicked")
        })

         function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1}, ${val2}, ${val3})`
         }

           let a= setInterval(()=>{
                document.querySelector(".childcontainer").style.background=getRandomColor()
            },1000);
            setTimeout(()=>{
                document.querySelector(".child").style.background=getRandomColor()
            },5000);

            console.log(a)
    </script>
</body>
</html>
