<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animination</title>
    <style>
       *{
            margin: 0;
            padding: 0;
            
        }
         .container{
            width: 100vw;
            height: 100vh;
            background-color: antiquewhite;
            box-sizing: border-box;
         }
        .box{
            width: 200px;
            height: 30px;
            background-color: blue;
            position: relative;
            border-radius: 25px;
            text-align: center;
            color: azure;
            animation-name: Welcome;
            animation-duration: 6s;
            /* animation-delay: 2s; */
            animation-iteration-count: infinite;
            margin: 10px;
            border: 5px solid yellow;
            /* animation-timing-function: cubic-bezier(0.8 0.9 0.5); */

            animation-direction: alternate;
        }
        @keyframes Welcome {
            from {
                top: 0;
                left: 0;
            }
            to {
                top: 0;
                left: 1200px;
            }
            
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Welcome</div>
    </div>
  \
</html>
