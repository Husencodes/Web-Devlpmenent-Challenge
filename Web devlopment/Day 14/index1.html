<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Querry</title>
    <style>
        .container {

            border: 2px solid black;
        }

        .box {
            width: 200px;
            height: 200px;
            border: 2px solid black;
        }

        #box1 {
            background-color: aqua;
        }

        #box2 {
            background-color: rgb(240, 244, 15);
        }

        #box3 {
            background-color: rgb(243, 9, 216);
        }

        #box4 {
            background-color: rgb(29, 211, 5);
        }

        #box5 {
            background-color: rgb(233, 81, 35);
        }

        @media (min-width:450px) {
            .container {
               display: flex;
            }

        }

      

        
    </style>
</head>

<body>
    <div class="container">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
        <div class="box" id="box5"></div>
    </div>
</body>

</html>
