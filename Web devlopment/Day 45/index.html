   <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
     <script>
        // Trigger celebration blast on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(fireBlast, 300);
        });

        function fireBlast() {
            // Left fireworks
            confetti({
                particleCount: 250,
                angle: 60,
                spread: 55,
                origin: { x: 0, y: 0.7 }
            });
            // Right fireworks
            confetti({
                particleCount: 250,
                angle: 120,
                spread: 55,
                origin: { x: 1, y: 0.7 }
            });
            // Center big burst
            setTimeout(() => {
                confetti({
                    particleCount: 250,
                    spread: 100,
                    origin: { y: 0.6 }
                });
            }, 250);
        }
        </script>
