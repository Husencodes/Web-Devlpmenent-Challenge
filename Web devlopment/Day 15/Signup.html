<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="Signup.css">
</head>

<body>
    <form class="box">
        <h2>Sign up</h2>
        <hr width="370">
        <div>
            <label for="first" style="display: block;">Username</label>
            <input type="text" id="first" placeholder="Enter your username" required>
        </div>
        <div>
            <label for="second" style="display: block;">Email</label>
            <input type="email" id="second" placeholder="Enter your Email" required>
        </div>
        <label for="third" style="display: block;">Password</label>
        <input type="password" id="third" placeholder=" Password" required>

        </div>
        </div>
        <label for="third" style="display: block;"> Confirm Password</label>
        <input type="password" id="third" placeholder="Confirm Password" required>
        </div>
        <div>
            <button>Sign up</button>
        </div>
    </form>
</body>

</html>
